name: "hacknation-enut-lab"
description: "Agentic laboratory for ENUT data analysis with a Shared Research State"

policies:
  - require_human_approval_for_tools: false
  - enforce_json_output: true

agents:
  # 1. Literature Agent
  - name: literature_agent
    role: "Literature Agent"
    scientific_decision: "What prior evidence exists" #[cite: 5]
    input: "question" #[cite: 5]
    output: "evidence cards + citations" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Literature Agent. You will receive a research state in JSON format.
      Task: Search for relevant literature regarding the 'research_question'.
      Action: Append your findings to the 'evidence' array.
      Constraint: You MUST return the fully updated JSON object, strictly no markdown or conversational text.
    tools:
      - search_openalex

  # 2. Hypothesis Agent
  - name: hypothesis_agent
    role: "Hypothesis Agent"
    scientific_decision: "What falsifiable explanation to test" #[cite: 5]
    input: "evidence" #[cite: 5]
    output: "ranked hypotheses" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Hypothesis Agent. You receive the research state JSON with populated evidence.
      Task: Formulate falsifiable hypotheses based on the 'evidence'.
      Action: Append these to the 'hypotheses' array (include id, claim, and status: 'untested').
      Constraint: You MUST return the updated JSON.

  # 3. Data Steward
  - name: data_steward
    role: "Data Steward"
    scientific_decision: "If the data allows testing it" #[cite: 5]
    input: "hypothesis" #[cite: 5]
    output: "variable map + quality report" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Data Steward. You receive the research state JSON.
      Task: Evaluate if the ENUT dataset can test the leading hypothesis.
      Action: Map required data points in the 'variables' object and note any limitations in the 'limitations' array.
      Constraint: You MUST return the updated JSON.

  # 4. Experiment Planner
  - name: experiment_planner
    role: "Experiment Planner"
    scientific_decision: "What test maximizes learning" #[cite: 5]
    input: "hypotheses + data" #[cite: 5]
    output: "experiment spec" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Experiment Planner. You receive the research state JSON.
      Task: Design the statistical test or regression for the hypothesis using the variable map.
      Action: Append the design to the 'experiments' array (include id, hypothesis_id, method, and status: 'planned').
      Constraint: You MUST return the updated JSON.

  # 5. Experiment Runner
  - name: experiment_runner
    role: "Experiment Runner"
    scientific_decision: "Execute the test reproducibly" #[cite: 5]
    input: "experiment spec" #[cite: 5]
    output: "metrics + artifacts" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Experiment Runner. You receive the research state JSON.
      Task: Execute the planned experiment. Use your sandbox tool to run Python/R scripts on ENUT data.
      Action: Append the output metrics to the 'results' array and update the experiment status to 'completed'.
      Constraint: You MUST return the updated JSON.
    tools:
      - execute_python_sandbox

  # 6. Scientific Critic
  - name: scientific_critic
    role: "Scientific Critic"
    scientific_decision: "If we can trust the interpretation" #[cite: 5]
    input: "results" #[cite: 5]
    output: "critique + validation requests" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Scientific Critic. You receive the research state JSON with raw results.
      Task: Evaluate the p-values, methodology, and potential biases of the results.
      Action: Add your analysis to the 'limitations' or 'results' evaluation fields.
      Constraint: You MUST return the updated JSON.

  # 7. Discovery Director
  - name: discovery_director
    role: "Discovery Director"
    scientific_decision: "What to investigate next" #[cite: 5]
    input: "complete state" #[cite: 5]
    output: "next action" #[cite: 5]
    model: "databricks/dbrx-instruct"
    system_prompt: |
      You are the Discovery Director. You receive the complete, evaluated research state JSON.
      Task: Decide the next scientific step based on the entire cycle.
      Action: Update the 'next_decision' object with the next experiment ID and the reason.
      Constraint: You MUST return the updated JSON.

# Pipeline Orchestration
handoffs:
  - from: "user_input"
    to: "literature_agent"
  - from: "literature_agent"
    to: "hypothesis_agent"
  - from: "hypothesis_agent"
    to: "data_steward"
  - from: "data_steward"
    to: "experiment_planner"
  - from: "experiment_planner"
    to: "experiment_runner"
  - from: "experiment_runner"
    to: "scientific_critic"
  - from: "scientific_critic"
    to: "discovery_director"