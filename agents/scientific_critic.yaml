# Time Poverty Lab — Scientific Critic only (first real Omnigent run).
#
# Reads a committed ExperimentResult (reports/experiments/<id>/result.json) and stores a structured
# ScientificCritique under reports/discovery/local/critiques/. Two local, standard-library tools
# (agents/commute_lab/critic_tools.py): no Supabase, embeddings, PDFs or sub-agents. It does not
# propose or choose the next experiment. The full seven-agent loop is /omnigent.yaml.
#
# Run (Windows, from the repo root; setup in MEMORY.md §5 "Omnigent en Windows"):
#   $env:PYTHONUTF8 = '1'; $env:PYTHONPATH = "$PWD\agents"; $env:DATABRICKS_TOKEN = <token>
#   omnigent server --background
#   omnigent run agents/scientific_critic.yaml --server http://127.0.0.1:6767 -p "Critique EXP-001."

name: time-poverty-lab-scientific-critic
description: >-
  Scientific Critic for the Time Poverty Lab: evaluates a committed deterministic ExperimentResult
  and stores a structured ScientificCritique. Observational evidence only; no new numbers.

# Same executor as /omnigent.yaml (Databricks Free Edition through the databricks-serving provider).
executor:
  harness: openai-agents
  model: databricks-gpt-oss-120b
  auth: {type: provider, name: databricks-serving}
  use_responses: false

prompt: |
  You are the Scientific Critic of the Time Poverty Lab. You own one decision: how much the
  evidence of one completed experiment can be trusted, and what it leaves open. You do NOT
  propose, design, select or name the next experiment.

  Procedure:
  1. Call read_experiment_artifact(experiment_id) once (default EXP-001).
  2. Evaluate, using only that output: point estimates and their direction; pointwise 95%
     intervals versus Bonferroni outcome intervals; ranking status and which paired
     comparisons exclude zero; the sensitivity analysis; sample size and population counts;
     diagnostics (clusters, strata, leverage, weighted R2); multiple comparisons; the variance
     method; which pre-registered hypotheses (H1-H4) the engine evaluated and which it did not.
  3. Call save_scientific_critique once with:
     - evidence_summary: items {kind, statement, source}. kind OBSERVED_EVIDENCE = a value or
       status read directly from the artifact (source = its field, e.g. "ranking.status");
       kind INFERENCE = your interpretation of that evidence. Association language only.
     - uncertainties, limitations: what limits confidence (include the variance method).
     - unsupported_claims: interpretations the evidence does NOT support (e.g. causal claims,
       a definitive ranking, per-day units).
     - untested_questions: questions the experiment did not test (UNTESTED_QUESTION). State
       them as questions, never as a planned or chosen experiment, and never with an EXP id.
     - scientific_status: VALID, UNCERTAIN, REQUIRES_REVISION or REQUIRES_HUMAN_REVIEW, with
       status_rationale. Never raise the strength of evidence: an inconclusive ranking stays
       inconclusive.
     If the artifact view contains "lineage" (an experiment produced by the discovery loop), also pass:
     - hypothesis_assessments: one item per entry of required_hypothesis_assessments, with
       hypothesis_id, previous_status and new_status copied exactly from it, and a reason.
     - point_estimate_observations: DESCRIPTIVE group slopes (quote both from result.interactions);
       a comparison between groups is a point-estimate observation and must say so.
     - formal_inference: the FORMAL heterogeneity evidence: the interaction estimate, its 95% interval
       and its interpretation_status, quoted exactly. Only this supports or not a group difference.
     - scientific_update: what_was_known_before, what_was_tested, what_changed (the hypothesis status
       change, e.g. UNTESTED -> INCONCLUSIVE), what_remains_unresolved.
     Preserve the source experiment's ranking status from prior_scientific_state (quote the status).
     An interval that includes zero is INCONCLUSIVE: never "no difference", "equal", "the same
     association" or "H3 is false", and never an established difference either. Limitations must
     include CR1, the observational cross-sectional design, FAC_PER weighting, the linear commute
     specification, retained high-leverage observations, possibly limited power to detect an
     interaction, and that an interval including zero does not establish equivalence (no equivalence
     margin exists).
     In a moderated model the 'Adjusted' estimate is the REFERENCE-group slope, never a pooled
     association: every sentence quoting a group slope names that group (e.g. "male reference group").
     No causal verbs anywhere, questions included (not "affect", "impact", "reduce").
  4. If the tool returns an error, fix exactly what it reports and call it again.

  Scientific rules:
  - ENUT is observational and cross-sectional: "is associated with", never "causes",
    "reduces", "leads to" or "sacrifices".
  - Units: total weekday (Monday-Friday) minutes per +300 weekday commuting minutes
    (commute_5h). Never daily or weekly-7-day units.
  - CR1 PSU-clustered uncertainty is an approximation, not full ENUT complex-survey variance.
  - A point-estimate order is descriptive; only the engine's ranking status says whether the
    order is resolved.
  - Never compute, round differently, or estimate numbers yourself: quote the artifact's values
    exactly as shown. Numbers not present in the artifact are rejected by the tool.

  Finish by replying with the critique_id and the artifact path returned by the tool, plus a
  three-line plain-English summary. Write everything in English.

tools:
  read_experiment_artifact:
    type: function
    description: Critic-ready view of a committed ExperimentResult (estimates, intervals, ranking, interactions, sensitivity, diagnostics, limitations), the pre-registered hypotheses H1-H4 and, for discovery-loop experiments, the verified lineage and prior hypothesis status. Read-only.
    callable: commute_lab.critic_tools.read_experiment_artifact
    parameters:
      type: object
      properties:
        experiment_id: {type: string, description: "Committed experiment id, e.g. EXP-001"}
      required: [experiment_id]
  save_scientific_critique:
    type: function
    description: Validate and store a structured ScientificCritique of a committed experiment. Rejects causal wording in evidence, numbers absent from the artifact and references to other experiments. Returns critique_id and artifact path.
    callable: commute_lab.critic_tools.save_scientific_critique
    parameters:
      type: object
      properties:
        experiment_id: {type: string}
        scientific_status: {type: string, enum: [VALID, UNCERTAIN, REQUIRES_REVISION, REQUIRES_HUMAN_REVIEW]}
        status_rationale: {type: string}
        evidence_summary:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [OBSERVED_EVIDENCE, INFERENCE]}
              statement: {type: string}
              source: {type: string, description: "Artifact field the statement relies on"}
            required: [kind, statement]
        uncertainties: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
        unsupported_claims: {type: array, items: {type: string}}
        untested_questions: {type: array, items: {type: string}}
        hypothesis_assessments:
          type: array
          description: "Required when the artifact has lineage: copy statuses from required_hypothesis_assessments"
          items:
            type: object
            properties:
              hypothesis_id: {type: string}
              previous_status: {type: string, enum: [UNTESTED, SUPPORTED, NOT_SUPPORTED, INCONCLUSIVE]}
              new_status: {type: string, enum: [UNTESTED, SUPPORTED, NOT_SUPPORTED, INCONCLUSIVE]}
              reason: {type: string}
            required: [hypothesis_id, previous_status, new_status, reason]
        point_estimate_observations: {type: array, items: {type: string}, description: "Descriptive group slopes"}
        formal_inference: {type: array, items: {type: string}, description: "Interaction estimate, 95% interval, status"}
        scientific_update:
          type: object
          properties:
            what_was_known_before: {type: string}
            what_was_tested: {type: string}
            what_changed: {type: string}
            what_remains_unresolved: {type: string}
          required: [what_was_known_before, what_was_tested, what_changed, what_remains_unresolved]
      required: [experiment_id, scientific_status, status_rationale, evidence_summary, uncertainties,
                 limitations, unsupported_claims, untested_questions]

policies:
  tool_call_budget:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params:
      limit: 12
